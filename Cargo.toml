[package]
name = "vox-core"
version = "0.1.0"
edition = "2024"

[features]
# Test/development-only synthetic provider. It is intentionally off by default.
sandbox = []

[dependencies]
axum = "0.8.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "charset", "query", "stream"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
rig = { version = "0.42.0", default-features = false, features = ["agent", "derive", "reqwest", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vox-core-api"
path = "src/bin/vox-core-api.rs"

[[bin]]
name = "vox-core-worker"
path = "src/bin/vox-core-worker.rs"
