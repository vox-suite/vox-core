[package]
name = "vox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
yaml_serde = "0.10.7"
vox-connections = { git = "https://github.com/vox-suite/vox-connections.git", rev = "99458ac17ec62025f392b18638d21dc8e3310c52" }
vox-shared = { git = "https://github.com/vox-suite/vox-shared.git", branch = "main" }
axum = { version = "0.8.9", features = ["ws"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rsa = { version = "0.9.10", features = ["sha2"] }
jsonschema = "0.57"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "charset", "query", "stream"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
ring = "0.17.14"
rig = { version = "0.42.0", default-features = false, features = ["agent", "derive", "reqwest", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
uuid = { version = "1", features = ["serde", "v4"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
url = "2"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
base64 = "0.23.1"
bytes = "1"
unicode-segmentation = "1.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "pool"] }
regex = "1.13.1"

[[bin]]
name = "vox-core-api"
path = "services/api/main.rs"

[[bin]]
name = "vox-core-worker"
path = "services/worker/main.rs"

[[bin]]
name = "vox-core-defaults"
path = "services/defaults/main.rs"

[[bin]]
name = "vox-core-check-database"
path = "services/database-check/main.rs"
