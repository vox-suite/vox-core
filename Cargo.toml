[package]
name = "vox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vox-core-api"
path = "src/bin/vox-core-api.rs"

[[bin]]
name = "vox-core-worker"
path = "src/bin/vox-core-worker.rs"
