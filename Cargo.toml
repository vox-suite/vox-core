[package]
name = "vox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "charset", "query", "stream"] }
rig = { version = "0.42.0", default-features = false, features = ["agent", "derive", "reqwest", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vox-core-api"
path = "src/bin/vox-core-api.rs"

[[bin]]
name = "vox-core-worker"
path = "src/bin/vox-core-worker.rs"
