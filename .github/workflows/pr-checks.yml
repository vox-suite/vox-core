name: Core PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: cargo test --locked --all-targets
      - name: PostgreSQL acceptance suites
        env:
          PGPASSWORD: postgres
        run: |
          for suite in migration_contract rls_isolation status_updates; do
            createdb -h 127.0.0.1 -U postgres "vox_${suite}"
            TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/vox_${suite}" \
              cargo test --locked --test "$suite" -- --ignored --test-threads=1
          done
