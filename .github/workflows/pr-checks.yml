name: Core PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  deployment-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=core-images
          cache-to: type=gha,mode=max,scope=core-images
      - name: Build production worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha,scope=core-images
          cache-to: type=gha,mode=max,scope=core-images
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vox-core
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: vox-core
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-connections
          ref: 4136e1020fb8e01fde13215afa2eb4e7daeb0a59
          path: vox-connections
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-shared
          path: vox-shared
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: cargo test --locked --all-targets
      - name: Production API router assembly
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked --bin vox-core-api production_api_router_assembles_without_overlapping_routes -- --ignored
      - name: PostgreSQL migration smoke test
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_migrations
          for migration_file in migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d vox_core_migrations -v ON_ERROR_STOP=1 -f "$migration_file"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vox_core_migrations -Atc 'SHOW server_version_num')" -ge 180000
          psql -h 127.0.0.1 -U postgres -d vox_core_migrations -v ON_ERROR_STOP=1 -Atc "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -Eq '^[0-9]+\.'
      - name: Scoped Pulse discovery and history
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_pulse_recovery
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_pulse_recovery
          cargo test --locked --lib application::pulse::tests -- --ignored --skip six_chart_database_budget
      - name: Shared connector lifecycle against Core schema
        env:
          CONNECTIONS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_migrations
        run: cargo test --manifest-path ../vox-connections/Cargo.toml --lib accounts::tests -- --ignored
      - name: Owned assistant isolation and concurrent provisioning
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_owned_agents
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_owned_agents
          cargo test --locked --lib concurrent_defaults_and_specialists_are_owned_and_versioned -- --ignored
      - name: Ownership transition preserves action evidence
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_owned_transition
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_owned_transition
          cargo test --locked --lib ownership_transition_expires_unused_decisions_and_preserves_outcomes -- --ignored
      - name: Agent memory isolation and immediate archive enforcement
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_owned_agents
        run: cargo test --locked --lib agent_memory_is_scoped_bounded_and_revocation_aware -- --ignored
      - name: Durable task context and production worker boundaries
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_durable_tasks
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_durable_tasks
          cargo test --locked --lib durable_task_context_and_worker_wait_boundaries -- --ignored
      - name: Governed assigned-run recovery and fencing
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_assigned_runs
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_assigned_runs
          cargo test --locked --lib assigned_worker_is_pinned_fenced_recoverable_and_queryable -- --ignored
          cargo test --locked --lib cancelled_task_denies_new_approval_start_and_dispatch -- --ignored
      - name: Scoped specialist delegation PostgreSQL regression
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_delegation
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_delegation
          cargo test --locked --lib delegation_is_scoped_revocable_and_returns_only_bounded_work -- --ignored

      - name: Atomic calendar and gaming ingestion regressions
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_connection_ingestion
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_connection_ingestion
          cargo test --locked --lib fresh_connections::ingestion_tests -- --ignored

      - name: Recovery upgrades preserve authority and imported history
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked --test recovery_migrations -- --ignored --test-threads=1
      - name: Public library platform against Core schema
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_migrations
        run: cargo test --manifest-path ../vox-connections/Cargo.toml --test postgres_integration -- --ignored
