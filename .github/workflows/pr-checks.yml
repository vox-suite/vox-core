name: Core PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vox-core
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: vox-core
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-connections
          path: vox-connections
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-shared
          path: vox-shared
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: cargo test --locked --all-targets
      - name: PostgreSQL migration smoke test
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_migrations
          for migration_file in migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d vox_core_migrations -v ON_ERROR_STOP=1 -f "$migration_file"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vox_core_migrations -Atc 'SHOW server_version_num')" -ge 180000
          psql -h 127.0.0.1 -U postgres -d vox_core_migrations -v ON_ERROR_STOP=1 -Atc "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -Eq '^[0-9]+\.'
      - name: Shared connector lifecycle against Core schema
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_migrations
        run: cargo test --manifest-path ../vox-connections/Cargo.toml --test postgres_integration -- --ignored
      - name: Owned assistant isolation and concurrent provisioning
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_owned_agents
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_owned_agents
          cargo test --locked --lib concurrent_defaults_and_specialists_are_owned_and_versioned -- --ignored
      - name: Ownership transition preserves action evidence
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_core_owned_transition
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_owned_transition
          cargo test --locked --lib ownership_transition_expires_unused_decisions_and_preserves_outcomes -- --ignored
