name: Core PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vox-core
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: vox-core
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-connections
          path: vox-connections
      - uses: actions/checkout@v4
        with:
          repository: vox-suite/vox-shared
          path: vox-shared
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: cargo test --locked --all-targets
      - name: PostgreSQL migration smoke test
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres vox_core_migrations
          for migration_file in migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d vox_core_migrations -v ON_ERROR_STOP=1 -f "$migration_file"
          done
