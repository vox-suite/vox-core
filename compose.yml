name: vox

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: .
    command: ["/usr/local/bin/vox-core-api"]
    restart: unless-stopped
    env_file: ${VOX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VOX_CORE_BIND_ADDRESS: 0.0.0.0:3001
      REDIS_URL: redis://redis:6379
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  core-worker:
    build: .
    command: ["/usr/local/bin/vox-core-worker"]
    restart: unless-stopped
    env_file: ${VOX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VOX_CORE_BIND_ADDRESS: 0.0.0.0:3001
      VOX_BRIDGE_URL: http://bridge:3000
      REDIS_URL: redis://redis:6379
    depends_on:
      core-api:
        condition: service_healthy
      bridge:
        condition: service_healthy

  bridge:
    build: ../vox-bridge
    restart: unless-stopped
    env_file: ${VOX_ENV_FILE:-.env}
    environment:
      VOX_CORE_URL: http://core-api:3001
    ports:
      - "3000:3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
